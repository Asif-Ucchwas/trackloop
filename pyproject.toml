[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackloop"
version = "0.1.0"
description = "Path-tracking controllers on a vehicle model, with stability analysis and system identification"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "control", "osqp"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
